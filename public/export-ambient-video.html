<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE PRO — Ambient Seamless Background Video Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      max-width: 1040px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    header {
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      max-width: 600px;
      line-height: 1.5;
    }
    .preview-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(14, 165, 233, 0.2);
      background: #010309;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }
    button.primary-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.45);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button.primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(14, 165, 233, 0.65);
    }
    button.primary-btn:active {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .badge {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-live {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(14, 165, 233, 0.08);
    }
    .progress-bar-container {
      width: 100%;
      max-width: 440px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      transition: width 0.05s linear;
    }
    .status-log {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>JEE PRO — Ambient Seamless Background Video</h1>
      <p class="subtitle">Deterministic Frame-by-Frame Rendering • 60 FPS &bull; VP9 &bull; 50 Mbps &bull; 9.0s Mathematically Seamless Loop</p>
    </header>

    <div class="preview-card">
      <canvas id="ambientCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls">
      <button class="primary-btn" id="recordBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" />
        </svg>
        <span id="btnText">Export 9.0s Seamless Video (Deterministic)</span>
      </button>

      <span class="badge" id="timeBadge">Loop: 0.0s / 9.0s</span>
      <span class="badge badge-live" id="fpsBadge">Live: -- FPS</span>
      <span class="badge">1920 &times; 1080 @ 60fps</span>
    </div>

    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-log" id="statusLog"></div>
  </div>

  <script>
    const canvas = document.getElementById("ambientCanvas");
    // Request no-alpha context for maximum color precision and performance
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const recordBtn = document.getElementById("recordBtn");
    const btnText = document.getElementById("btnText");
    const timeBadge = document.getElementById("timeBadge");
    const fpsBadge = document.getElementById("fpsBadge");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const statusLog = document.getElementById("statusLog");

    const LOOP_DURATION = 9.0;
    const EXPORT_FPS = 60;
    const TOTAL_FRAMES = Math.round(EXPORT_FPS * LOOP_DURATION); // 540 frames exactly
    const EXPORT_BITRATE = 50_000_000; // 50 Mbps — eliminates block artifacts in dark gradients

    let startTime = null;

    // ─── Orb Configuration (PRESERVED EXACTLY — same composition, colors, motion) ───
    const orbs = [
      {
        baseX: 1920 * 0.22,
        baseY: 1080 * 0.16,
        radius: 720,
        colorStart: "rgba(14, 165, 233, 0.38)",
        colorMid: "rgba(99, 102, 241, 0.18)",
        ax: 92, bx: 22, ay: 72, by: 16,
        phaseX: 0, phaseY: Math.PI / 4,
        scaleAmp: 0.10, scalePhase: Math.PI / 6
      },
      {
        baseX: 1920 * 0.82,
        baseY: 1080 * 0.17,
        radius: 650,
        colorStart: "rgba(217, 70, 239, 0.28)",
        colorMid: "rgba(124, 58, 237, 0.15)",
        ax: -100, bx: 20, ay: -78, by: 18,
        phaseX: Math.PI / 2, phaseY: 0,
        scaleAmp: 0.09, scalePhase: -Math.PI / 4
      },
      {
        baseX: 1920 * 0.90,
        baseY: 1080 * 0.56,
        radius: 760,
        colorStart: "rgba(139, 92, 246, 0.30)",
        colorMid: "rgba(236, 72, 153, 0.12)",
        ax: 85, bx: -22, ay: 95, by: 16,
        phaseX: Math.PI / 3, phaseY: Math.PI / 4,
        scaleAmp: 0.11, scalePhase: Math.PI / 2
      },
      {
        baseX: 1920 * 0.08,
        baseY: 1080 * 0.50,
        radius: 720,
        colorStart: "rgba(6, 182, 212, 0.28)",
        colorMid: "rgba(16, 185, 129, 0.14)",
        ax: -95, bx: 24, ay: 82, by: -18,
        phaseX: Math.PI / 4, phaseY: -Math.PI / 4,
        scaleAmp: 0.10, scalePhase: Math.PI / 3
      },
      {
        baseX: 1920 * 0.50,
        baseY: 1080 * 0.94,
        radius: 800,
        colorStart: "rgba(168, 85, 247, 0.28)",
        colorMid: "rgba(56, 189, 248, 0.14)",
        ax: 90, bx: 18, ay: -68, by: 20,
        phaseX: -Math.PI / 4, phaseY: 0,
        scaleAmp: 0.09, scalePhase: 0
      }
    ];

    // ─── Scene Renderer (PRESERVED EXACTLY) ───
    function drawScene(t) {
      const w = canvas.width;
      const h = canvas.height;

      const bgGrad = ctx.createRadialGradient(w * 0.5, -h * 0.1, 0, w * 0.5, h * 0.5, w * 0.95);
      bgGrad.addColorStop(0, "#0c142e");
      bgGrad.addColorStop(0.65, "#030712");
      bgGrad.addColorStop(1, "#010309");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "screen";

      const theta = (t / LOOP_DURATION) * (Math.PI * 2);

      for (let i = 0; i < orbs.length; i++) {
        const orb = orbs[i];
        const x = orb.baseX + Math.sin(theta + orb.phaseX) * orb.ax + Math.sin(2 * theta) * orb.bx;
        const y = orb.baseY + Math.cos(theta + orb.phaseY) * orb.ay + Math.cos(2 * theta) * orb.by;
        const scale = 1 + Math.sin(theta + orb.scalePhase) * orb.scaleAmp;
        const currentRadius = orb.radius * scale;

        const orbGrad = ctx.createRadialGradient(x, y, 0, x, y, currentRadius);
        orbGrad.addColorStop(0, orb.colorStart);
        orbGrad.addColorStop(0.38, orb.colorMid);
        orbGrad.addColorStop(0.72, "rgba(99, 102, 241, 0.015)");
        orbGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = orbGrad;
        ctx.beginPath();
        ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = "source-over";
      const vignette = ctx.createRadialGradient(w * 0.5, h * 0.48, w * 0.22, w * 0.5, h * 0.48, w * 0.75);
      vignette.addColorStop(0, "rgba(3, 7, 18, 0)");
      vignette.addColorStop(0.55, "rgba(3, 7, 18, 0.45)");
      vignette.addColorStop(1, "rgba(1, 3, 9, 0.88)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, w, h);
    }

    // ─── Live Preview Loop (uncapped, uses RAF) ───
    let liveFrameCount = 0;
    let lastFpsUpdate = performance.now();

    function animate(currentTime) {
      if (!startTime) startTime = currentTime;
      const elapsed = (currentTime - startTime) / 1000;
      const loopTime = elapsed % LOOP_DURATION;

      drawScene(loopTime);

      timeBadge.textContent = `Loop: ${loopTime.toFixed(1)}s / ${LOOP_DURATION.toFixed(1)}s`;

      liveFrameCount++;
      if (currentTime - lastFpsUpdate >= 500) {
        const liveFps = Math.round((liveFrameCount * 1000) / (currentTime - lastFpsUpdate));
        fpsBadge.textContent = `Live: ${liveFps} FPS`;
        liveFrameCount = 0;
        lastFpsUpdate = currentTime;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // ─── Deterministic Frame-by-Frame Export Pipeline ───
    //
    // Architecture:
    //   1. captureStream(0) — manual frame mode: NO automatic capture, NO timer-driven capture.
    //   2. For each of the 540 frames (60fps × 9s):
    //      a. Compute exact time: t = (frameIndex / TOTAL_FRAMES) * LOOP_DURATION
    //      b. Draw the scene at that exact timestamp
    //      c. Call videoTrack.requestFrame() to capture the current canvas state
    //      d. Yield to the event loop so MediaRecorder can process the frame
    //   3. Every frame has a mathematically exact timestamp — no drops, no dupes, no jitter.
    //
    // This eliminates:
    //   - Frame timing irregularity from RAF variance
    //   - Dropped frames from browser compositor contention
    //   - Duplicated frames from captureStream's automatic mode
    //   - The setInterval polling approach entirely

    recordBtn.addEventListener("click", async () => {
      recordBtn.disabled = true;
      progressContainer.style.display = "block";
      progressBar.style.width = "0%";
      statusLog.textContent = "Initializing deterministic export pipeline...";

      // 1. Create a manual-capture stream (fps=0 means: only capture on requestFrame())
      const stream = canvas.captureStream(0);
      const videoTrack = stream.getVideoTracks()[0];

      if (!videoTrack || typeof videoTrack.requestFrame !== "function") {
        statusLog.textContent = "Error: Browser does not support manual frame capture (captureStream(0) + requestFrame). Try Chrome 91+.";
        recordBtn.disabled = false;
        progressContainer.style.display = "none";
        return;
      }

      // 2. Configure MediaRecorder with maximum quality VP9
      const mimeTypes = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
      ];
      const selectedMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || "video/webm";

      const recorder = new MediaRecorder(stream, {
        mimeType: selectedMime,
        videoBitsPerSecond: EXPORT_BITRATE
      });

      const chunks = [];
      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      // 3. Start recording
      recorder.start();
      statusLog.textContent = `Encoding: ${selectedMime} @ ${(EXPORT_BITRATE / 1_000_000).toFixed(0)} Mbps • ${TOTAL_FRAMES} frames deterministic`;

      // 4. Render each frame deterministically
      //    We yield control between frames using a short setTimeout(0) so the
      //    MediaRecorder encoder can process each captured frame without starvation.
      //    This is NOT a timing mechanism — the actual frame time is computed from frameIndex.
      const FRAMES_PER_BATCH = 4; // Process 4 frames per yield for speed while keeping encoder fed

      for (let frameIndex = 0; frameIndex < TOTAL_FRAMES; frameIndex++) {
        // Exact deterministic time for this frame
        const t = (frameIndex / TOTAL_FRAMES) * LOOP_DURATION;

        // Render the scene at this exact timestamp
        drawScene(t);

        // Capture this exact canvas state as one video frame
        videoTrack.requestFrame();

        // Update progress UI (throttled to avoid layout thrashing)
        if (frameIndex % 10 === 0 || frameIndex === TOTAL_FRAMES - 1) {
          const pct = ((frameIndex + 1) / TOTAL_FRAMES) * 100;
          progressBar.style.width = `${pct}%`;
          btnText.textContent = `Rendering: ${frameIndex + 1} / ${TOTAL_FRAMES} frames (${pct.toFixed(0)}%)`;
        }

        // Yield to event loop periodically so the encoder can process buffered frames
        if (frameIndex % FRAMES_PER_BATCH === 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }

      // 5. Signal recording complete
      statusLog.textContent = "Flushing encoder buffer...";
      btnText.textContent = "Finalizing video...";

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: selectedMime });
        const sizeMB = (blob.size / (1024 * 1024)).toFixed(1);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `jee-pro-ambient-loop-9s-60fps-deterministic.webm`;
        a.click();

        // Don't revoke immediately — let the download start
        setTimeout(() => URL.revokeObjectURL(url), 10000);

        statusLog.textContent = `Export complete: ${sizeMB} MB • ${TOTAL_FRAMES} frames • ${selectedMime}`;
        btnText.textContent = "Export Complete!";
        progressBar.style.width = "100%";

        setTimeout(() => {
          recordBtn.disabled = false;
          btnText.textContent = "Export 9.0s Seamless Video (Deterministic)";
          progressContainer.style.display = "none";
          progressBar.style.width = "0%";
        }, 3000);
      };

      // Give the encoder a moment to finish processing the last frames, then stop
      await new Promise(resolve => setTimeout(resolve, 200));
      recorder.stop();
    });
  </script>
</body>
</html>
